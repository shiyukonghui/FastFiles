# FastFiles GitHub Actions CI/CD 工作流
# 推送版本标签（如 v0.3.0）时自动构建多平台 Tauri 应用并发布到 GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装系统依赖（Linux）
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用并发布到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FastFiles ${{ github.ref_name }}'
          releaseBody: |
            ## FastFiles ${{ github.ref_name }}

            局域网零配置文件传输工具。

            ### 下载
            请根据您的操作系统选择对应的安装包。

            ### 更新内容
            详见 git log。
          releaseDraft: false
          prerelease: false
